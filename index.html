<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>In-Engine Co-Play Prototype</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { overflow: hidden; background: #0d1117; color: #fff; }
    #hud {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      background: rgba(13, 17, 23, 0.85); border: 1px solid #30363d;
      padding: 14px 18px; border-radius: 10px; backdrop-filter: blur(6px);
      max-width: 320px;
    }
    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 6px;
      font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px;
    }
    .role-host { background: #d29922; color: #000; }
    .role-player { background: #2ea043; color: #fff; }
    .role-ghost { background: #8957e5; color: #fff; }
    #stats { font-size: 13px; color: #8b949e; margin-bottom: 10px; }
    #controls {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 10;
      background: rgba(13, 17, 23, 0.88); border: 1px solid #30363d;
      padding: 10px 16px; border-radius: 12px;
    }
    button {
      background: #21262d; color: #f0f6fc; border: 1px solid #30363d;
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600;
      transition: background 0.15s;
    }
    button:hover { background: #30363d; }
    button.primary { background: #238636; border-color: #2ea043; }
    button.primary:hover { background: #2ea043; }
    #emote-feed {
      position: fixed; top: 16px; right: 16px; text-align: right;
      pointer-events: none; font-size: 28px; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="role-badge" class="badge role-ghost">Connecting...</div>
    <div id="stats">Active: 0/16 | Ghosts: 0</div>
    <div id="instructions" style="font-size: 12px; color: #c9d1d9;">
      WASD / Arrows to move (Host & Active Players). Ghosts fly freely and trigger crowd events!
    </div>
  </div>

  <div id="emote-feed"></div>

  <div id="controls">
    <button id="btn-role" class="primary">Jump In (Play)</button>
    <button onclick="sendEmote('🔥')">🔥 Hype</button>
    <button onclick="sendEmote('😱')">😱 Panic</button>
    <button onclick="triggerMeteor()">☄️ Drop Meteor</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // CHANGE THIS URL when deploying to Render or Cloudflare Tunnel:
    const WS_URL = location.hostname === 'localhost' || location.protocol === 'file:'
      ? 'ws://localhost:3000'
      : 'wss://coplay-mvp.onrender.com/';

    // --- THREE.JS SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);
    scene.fog = new THREE.FogExp2(0x0d1117, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 18, 22);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(10, 25, 15);
    scene.add(dirLight);

    // Arena Floor & Grid
    const floor = new THREE.Mesh(
      new THREE.CylinderGeometry(16, 16, 0.5, 32),
      new THREE.MeshStandardMaterial({ color: 0x161b22, roughness: 0.8 })
    );
    floor.position.y = -0.25;
    scene.add(floor);
    scene.add(new THREE.GridHelper(32, 16, 0x30363d, 0x21262d));

    // --- ENTITY MANAGEMENT ---
    const meshes = new Map(); // id -> THREE.Mesh
    const meteors = [];
    let myId = null;
    let myRole = 'ghost';
    let localPos = { x: 0, z: 0 };

    function createAvatarMesh(role) {
      const isHost = role === 'host';
      const geo = isHost
        ? new THREE.CapsuleGeometry(0.9, 1.8, 4, 8) // Giant Titan Host
        : new THREE.CapsuleGeometry(0.45, 0.9, 4, 8);
      const mat = new THREE.MeshStandardMaterial({
        color: isHost ? 0xd29922 : 0x2ea043,
        roughness: 0.4
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = isHost ? 1.8 : 0.9;
      scene.add(mesh);
      return mesh;
    }

    // Local translucent Ghost indicator (client-side only, zero network spam)
    const ghostCursor = new THREE.Mesh(
      new THREE.SphereGeometry(0.45, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0x8957e5, transparent: true, opacity: 0.55 })
    );
    ghostCursor.position.y = 2.5;
    scene.add(ghostCursor);

    // --- WEBSOCKET CONNECTION ---
    const ws = new WebSocket(WS_URL);

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === 'init') {
        myId = msg.id;
        updateRoleUI(msg.role);
        msg.players.forEach((p) => {
          const m = createAvatarMesh(p.role);
          m.position.set(p.x, m.position.y, p.z);
          meshes.set(p.id, m);
          if (p.id === myId) localPos = { x: p.x, z: p.z };
        });
      }

      if (msg.type === 'player_joined') {
        if (!meshes.has(msg.player.id)) {
          const m = createAvatarMesh(msg.player.role);
          m.position.set(msg.player.x, m.position.y, msg.player.z);
          meshes.set(msg.player.id, m);
        }
      }

      if (msg.type === 'player_left') {
        if (meshes.has(msg.id)) {
          scene.remove(meshes.get(msg.id));
          meshes.delete(msg.id);
        }
      }

      if (msg.type === 'move') {
        const m = meshes.get(msg.id);
        if (m) {
          m.position.x = msg.x;
          m.position.z = msg.z;
        }
      }

      if (msg.type === 'new_host') {
        if (msg.hostId === myId) updateRoleUI('host');
        if (meshes.has(msg.hostId)) {
          scene.remove(meshes.get(msg.hostId));
          meshes.set(msg.hostId, createAvatarMesh('host'));
        }
      }

      if (msg.type === 'role_changed') {
        updateRoleUI(msg.role);
        if (msg.role === 'ghost' && meshes.has(myId)) {
          scene.remove(meshes.get(myId));
          meshes.delete(myId);
        } else if (msg.role === 'player') {
          const m = createAvatarMesh('player');
          localPos = { x: msg.player.x, z: msg.player.z };
          m.position.set(localPos.x, m.position.y, localPos.z);
          meshes.set(myId, m);
        }
      }

      if (msg.type === 'stats') {
        document.getElementById('stats').textContent =
          `Active: ${msg.activeCount}/16 | Ghosts: ${msg.ghostCount}`;
      }

      if (msg.type === 'emote') {
        showEmoteEffect(msg.emote);
      }

      if (msg.type === 'meteor') {
        spawnMeteor(msg.x, msg.z);
      }

      if (msg.type === 'queue_full') {
        alert('Active player slots (16/16) are full! Watch as a Ghost or drop meteors.');
      }
    };

    // --- CROWD EFFECTS & UI ---
    function updateRoleUI(role) {
      myRole = role;
      const badge = document.getElementById('role-badge');
      const btn = document.getElementById('btn-role');
      badge.className = `badge role-${role}`;
      badge.textContent = role === 'host' ? '👑 Streamer Host' : role === 'player' ? '⚔️ Active Player' : '👻 Ghost Spectator';
      ghostCursor.visible = (role === 'ghost');

      if (role === 'host') {
        btn.style.display = 'none';
      } else {
        btn.style.display = 'inline-block';
        btn.textContent = role === 'ghost' ? 'Jump In (Play)' : 'Switch to Ghost';
      }
    }

    function showEmoteEffect(emote) {
      const feed = document.getElementById('emote-feed');
      const el = document.createElement('div');
      el.textContent = emote;
      feed.prepend(el);
      setTimeout(() => el.remove(), 1500);

      // In-engine lighting shift based on crowd emote!
      if (emote === '🔥') dirLight.color.setHex(0xff7b00);
      if (emote === '😱') dirLight.color.setHex(0x388bfd);
      clearTimeout(window.lightReset);
      window.lightReset = setTimeout(() => dirLight.color.setHex(0xffffff), 800);
    }

    function spawnMeteor(x, z) {
      const meteor = new THREE.Mesh(
        new THREE.DodecahedronGeometry(1.1),
        new THREE.MeshStandardMaterial({ color: 0xf85149, emissive: 0x8b1a10 })
      );
      meteor.position.set(x, 18, z);
      scene.add(meteor);
      meteors.push(meteor);
    }

    window.sendEmote = (emote) => ws.send(JSON.stringify({ type: 'emote', emote }));
    window.triggerMeteor = () => ws.send(JSON.stringify({ type: 'trigger_meteor' }));

    document.getElementById('btn-role').onclick = () => {
      const targetRole = myRole === 'ghost' ? 'player' : 'ghost';
      ws.send(JSON.stringify({ type: 'request_role', role: targetRole }));
    };

    // --- INPUT & GAME LOOP ---
    const keys = {};
    window.addEventListener('keydown', (e) => (keys[e.key.toLowerCase()] = true));
    window.addEventListener('keyup', (e) => (keys[e.key.toLowerCase()] = false));

    let lastNetSend = 0;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const speed = 10 * dt;

      let moved = false;
      if (keys['w'] || keys['arrowup']) { localPos.z -= speed; moved = true; }
      if (keys['s'] || keys['arrowdown']) { localPos.z += speed; moved = true; }
      if (keys['a'] || keys['arrowleft']) { localPos.x -= speed; moved = true; }
      if (keys['d'] || keys['arrowright']) { localPos.x += speed; moved = true; }

      // Keep inside arena radius
      const dist = Math.hypot(localPos.x, localPos.z);
      if (dist > 14.5) {
        localPos.x *= 14.5 / dist;
        localPos.z *= 14.5 / dist;
      }

      if (myRole === 'ghost') {
        ghostCursor.position.x = localPos.x;
        ghostCursor.position.z = localPos.z;
        ghostCursor.position.y = 2.5 + Math.sin(clock.elapsedTime * 3) * 0.3;
      } else if (meshes.has(myId)) {
        const myMesh = meshes.get(myId);
        myMesh.position.x = localPos.x;
        myMesh.position.z = localPos.z;

        // Send movement at ~30Hz max
        const now = performance.now();
        if (moved && now - lastNetSend > 33 && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'move', x: localPos.x, z: localPos.z }));
          lastNetSend = now;
        }
      }

      // Animate falling meteors
      for (let i = meteors.length - 1; i >= 0; i--) {
        meteors[i].position.y -= 22 * dt;
        meteors[i].rotation.x += 3 * dt;
        if (meteors[i].position.y <= 0.5) {
          scene.remove(meteors[i]);
          meteors.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
